<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Create User</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/public/styles/create-user.css">
</head>
<body>

<header class="top-bar">
    <div class="logo">FINCH</div>
    <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/logout" class="logout">Log out</a>
    </nav>
</header>

<main class="content">

    <h1 class="page-title">Create User</h1>

    <!-- FORM CARD -->
    <div class="card">
        <form method="POST" action="/create-user">

            <input
                type="email"
                name="email"
                placeholder="Email address"
                required
            >

            <input
                type="text"
                name="firstname"
                placeholder="First name"
            >

            <input
                type="text"
                name="lastname"
                placeholder="Last name"
            >

            <select name="role_id" required>
                <option value="" disabled selected>
                    Select role
                </option>
                <?php foreach ($roles as $role): ?>
                    <?php if (
                        $_SESSION['user_role'] === 'MODERATOR'
                        && $role['name'] === 'ADMIN'
                    ) continue; ?>

                    <option value="<?= $role['id'] ?>">
                        <?= htmlspecialchars($role['name']) ?>
                    </option>

                <?php endforeach; ?>

            </select>

            <select name="company_id">
                <option value="">
                    Company (optional)
                </option>
                <?php foreach ($companies as $company): ?>
                    <option value="<?= $company['id'] ?>">
                        <?= htmlspecialchars($company['name']) ?>
                    </option>
                <?php endforeach; ?>
            </select>

            <button type="submit" class="btn-primary">
                Create user
            </button>
        </form>
    </div>

   <?php if (!empty($activationCode) || !empty($errorMessage)): ?>
        <div class="card" style="margin-top: 20px;">

            <?php if (!empty($activationCode)): ?>
                <h3>User created</h3>

                <p>
                    User <strong><?= htmlspecialchars($createdEmail) ?></strong>
                    has been created successfully.
                </p>

                <p><strong>Activation code:</strong></p>

                <div class="activation-code">
                    <?= htmlspecialchars($activationCode) ?>
                </div>
            <?php endif; ?>

            <?php if (!empty($errorMessage)): ?>
                <h3>Error</h3>

                <p class="error-message">
                    <?= htmlspecialchars($errorMessage) ?>
                </p>
            <?php endif; ?>

        </div>
    <?php endif; ?>

</main>

</body>
</html>
