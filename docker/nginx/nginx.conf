worker_processes 1;

events { }

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 500M;

    server {
        listen 80;
        server_name _;
        root /app;
        index index.php;

        # 1. VIDEO / UPLOADS
        location ^~ /public/uploads/ {
            root /app;
            types {
                video/mp4 mp4;
            }
            access_log off;
            expires max;
        }

        # 2. INNE STATYCZNE ZASOBY (CSS, JS, IMG)
        location ^~ /public/ {
            root /app;
            access_log off;
            expires 30d;
        }

        # 3. ROUTING MVC → index.php
        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        # 4. PHP-FPM
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 300;
            client_max_body_size 500M;
        }
    }
}
