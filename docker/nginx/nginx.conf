worker_processes 1;

events { }

http {
    client_max_body_size 500M;

    server {
        listen 80;
        server_name _;
        root /app/;
        index index.php;

        location /public/ {
            alias /app/public/;
        }

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            client_max_body_size 500M;
        }
    }
}
